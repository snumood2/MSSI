<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://gcjdxyauirbugbugltmv.supabase.co wss://gcjdxyauirbugbugltmv.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기분장애 임상평가 설문</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f7ff 0%, #e8f5e9 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading {
      text-align: center;
      color: #555;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #4263eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>로딩 중...</p>
  </div>

  <script type="module">
    import { createClient } from "./vendor/supabase-js.js";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function route() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) {
        window.location.replace("login.html?role=patient");
        return;
      }
      const user = session.user;

      const { data: prof } = await sb.from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();
      if (!prof) { window.location.replace("login.html"); return; }
      const map = {
        patient: "respondent.html",
        doctor: "doctor.html",
        admin: "admin.html",
        doctor_pending: "signup-doctor.html?pending=1",
        doctor_revoked: "signup-doctor.html?revoked=1"
      };
      window.location.replace(map[prof.role] || "login.html");
    }
    route();
  </script>
</body>
</html>
