<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>의사 회원가입 — 기분장애 임상평가 설문</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<div class="auth-wrapper">
  <div class="auth-header">
    <h1>🩺 의사 회원가입</h1>
    <p>기분장애 임상평가 설문 시스템</p>
  </div>

  <div class="auth-card">
    <h2>새 계정 만들기</h2>
    <div id="signupMsg" class="status-msg"></div>

    <div class="info-badge" style="font-size:13px;color:var(--text-sub);background:var(--accent-light);padding:12px 16px;border-radius:8px;margin-bottom:16px;line-height:1.6;">
      가입 후 관리자 승인이 필요합니다. 승인 완료 시 로그인이 가능합니다.
    </div>

    <div class="form-group">
      <label>아이디 <span class="required">*</span></label>
      <input type="text" id="s_id" placeholder="로그인에 사용할 아이디" autocomplete="off">
    </div>
    <div class="form-group">
      <label>비밀번호 <span class="required">*</span></label>
      <input type="password" id="s_pw" placeholder="4자리 이상" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>비밀번호 확인 <span class="required">*</span></label>
      <input type="password" id="s_pw2" placeholder="비밀번호 다시 입력" autocomplete="new-password">
    </div>

    <div class="form-divider"></div>

    <div class="form-group">
      <label>닉네임 <span class="required">*</span></label>
      <input type="text" id="s_dname" placeholder="닉네임 입력">
    </div>
    <div class="form-group">
      <label>병원닉네임 <span class="required">*</span></label>
      <input type="text" id="s_hname" placeholder="예: 분당별명">
    </div>
    <div class="form-group">
      <label>병원코드 <span class="optional">(병원닉네임 입력 시 자동 생성)</span></label>
      <input type="text" id="s_doctor_hcode" placeholder="자동 생성됩니다" readonly style="background:var(--bg-base);color:var(--text-sub);">
    </div>

    <button id="btnSignup" class="btn primary">가입하기</button>

    <div class="auth-link">
      <a href="login.html?role=doctor">이미 계정이 있으신가요? 로그인</a>
    </div>
  </div>

  <!-- 승인 대기 카드 -->
  <div class="auth-card" id="cardPending" style="display:none;">
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:40px;margin-bottom:12px;">⏳</div>
      <h3 style="font-size:18px;margin:0 0 8px;color:var(--text-main);">승인 대기 중</h3>
      <p style="font-size:14px;color:var(--text-sub);margin:0 0 6px;"><strong id="pendingName"></strong> 선생님의 가입이 접수되었습니다.</p>
      <p style="font-size:14px;color:var(--text-sub);">관리자 승인 후 로그인하실 수 있습니다.</p>
      <div style="margin-top:24px;">
        <a href="login.html?role=doctor" class="btn primary" style="display:inline-flex;width:auto;padding:0 32px;text-decoration:none;">로그인으로 이동</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  import { SUPABASE_URL, SUPABASE_ANON_KEY, DOCTOR_EMAIL_DOMAIN } from "./config.js";

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  const setMsg = (msg, type) => { const el = $("signupMsg"); el.className = `status-msg show ${type}`; el.textContent = msg; };
  const clearMsg = () => { $("signupMsg").className = "status-msg"; };

  const CONSONANT_MAP = {
    'ㄱ':'G','ㄲ':'K','ㄴ':'N','ㄷ':'D','ㄸ':'T','ㄹ':'L','ㅁ':'M',
    'ㅂ':'B','ㅃ':'P','ㅅ':'S','ㅆ':'SS','ㅇ':'','ㅈ':'J','ㅉ':'JJ',
    'ㅊ':'CH','ㅋ':'K','ㅌ':'T','ㅍ':'P','ㅎ':'H'
  };
  function extractConsonants(str) {
    let result = '';
    for (const ch of str) {
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const idx = Math.floor((code - 0xAC00) / 28 / 21);
        const cons = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][idx];
        const mapped = CONSONANT_MAP[cons];
        if (mapped) result += mapped;
      }
    }
    return result;
  }
  async function generateHospitalCode(hospitalName) {
    const consonants = extractConsonants(hospitalName || "").slice(0, 4);
    const base = consonants || "HOSP";
    for (let a = 0; a < 10; a++) {
      const digits = String(Math.floor(Math.random() * 90) + 10);
      const code = base + digits;
      const { data } = await sb.rpc("check_hospital_code", { p_code: code });
      if (!data) return code;
    }
    return base + String(Date.now()).slice(-4);
  }

  $("s_hname")?.addEventListener("input", async function() {
    if (this.value.trim().length >= 2) {
      const code = await generateHospitalCode(this.value.trim());
      $("s_doctor_hcode").value = code;
    }
  });

  $("btnSignup").addEventListener("click", async () => {
    clearMsg();
    const id = $("s_id").value.trim();
    const pw = $("s_pw").value;
    const pw2 = $("s_pw2").value;
    const dname = $("s_dname").value.trim();
    const hname = $("s_hname").value.trim();

    try {
      if (!id) throw "아이디를 입력하세요.";
      if (id.length < 2) throw "아이디는 2자 이상이어야 합니다.";
      if (!pw) throw "비밀번호를 입력하세요.";
      if (pw.length < 4) throw "비밀번호는 4자리 이상이어야 합니다.";
      if (pw !== pw2) throw "비밀번호가 일치하지 않습니다.";
      if (!dname) throw "닉네임을 입력하세요.";
      if (!hname) throw "병원닉네임을 입력하세요.";

      let hcode = $("s_doctor_hcode").value;
      if (!hcode) hcode = await generateHospitalCode(hname);

      const email = `${id}@${DOCTOR_EMAIL_DOMAIN}`;
      setMsg("가입 요청 중...", "info");
      $("btnSignup").disabled = true;

      const { data, error } = await sb.auth.signUp({
        email, password: pw,
        options: { data: { role: "doctor_pending", username: id, doctor_name: dname, hospital_name: hname, hospital_code: hcode } }
      });
      if (error) throw error.message;
      if (!data.user) throw "가입 요청 실패.";

      $("cardPending").style.display = "block";
      document.querySelector(".auth-card:not(#cardPending)").style.display = "none";
      const pendName = $("pendingName");
      if (pendName) pendName.textContent = dname;
    } catch (e) {
      setMsg(typeof e === "string" ? e : (e.message || "오류 발생"), "error");
      $("btnSignup").disabled = false;
    }
  });

  document.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") $("btnSignup").click(); });
  });
</script>
</body>
</html>
