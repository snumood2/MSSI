<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>의사 대시보드 — 기분장애 임상평가 설문</title>
  <link rel="stylesheet" href="styles.css">
  <style>

    .doctor-hero {
      background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
    }
    .doctor-hero h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .doctor-hero .sub {
      opacity: 0.8;
      font-size: 14px;
    }
    .doctor-hero .badge-white {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }
    .doctor-info-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #fff;
      margin-top: 10px;
    }
    .doctor-info-bar .sep {
      opacity: 0.4;
    }
    .doctor-info-bar .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doctor-info-bar .info-label {
      opacity: 0.7;
      font-weight: 500;
    }
    .doctor-info-bar .info-value {
      font-weight: 700;
    }
    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .empty-state p {
      font-size: 15px;
      font-weight: 500;
    }
    .empty-state .sub {
      font-size: 13px;
      margin-top: 6px;
    }
    .patient-list-loading {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 14px;
    }
    .spinner-small {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .print-btn-wrap .btn.sm {
      height: 36px;
      font-size: 12px;
      padding: 0 14px;
    }
    .doctor-dashboard {
      padding: 0 28px;
    }
    .doctor-dashboard-section {
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 84px;
    }
    .doctor-dashboard-section:last-child { border-bottom: none; }
    .doctor-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .doctor-section-header h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }
    .doctor-section-header p {
      margin: 4px 0 0;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.55;
    }
    .number-management-block {
      padding: 24px 0;
      border-top: 1px solid var(--border);
    }
    .number-management-block:first-of-type { border-top: none; padding-top: 0; }
    .number-management-block:last-child { padding-bottom: 0; }
    .number-management-block h4 { margin: 0 0 6px; font-size: 15px; }
    .number-management-block > p {
      margin: 0 0 18px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.55;
    }
    .number-management-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .number-request-row {
      display: grid;
      grid-template-columns: minmax(160px, 1.2fr) minmax(180px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #eef2f4;
    }
    .number-request-meta { color: var(--text-sub); font-size: 12px; line-height: 1.55; }
    .number-request-value { font-size: 14px; font-weight: 800; }
    .number-request-actions { display: flex; gap: 8px; }
    .number-direct-form {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 112px;
      gap: 12px;
      align-items: end;
    }
    .number-direct-form .form-group { margin: 0; }
    .number-direct-form .btn,
    .number-direct-details .btn {
      width: 112px;
      min-width: 112px;
      height: 52px;
      margin: 0;
    }
    .number-patient-summary {
      margin-top: 18px;
      padding: 14px 0;
      border-top: 1px solid #eef2f4;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.65;
    }
    .number-patient-summary strong { color: var(--text-main); }
    .number-direct-details {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) 112px;
      gap: 12px;
      align-items: end;
      margin-top: 4px;
    }
    .number-empty {
      color: var(--text-sub);
      font-size: 13px;
      padding: 12px 0;
    }
    @media (max-width: 720px) {
      .doctor-dashboard { padding: 0 18px; }
      .doctor-section-header { align-items: flex-start; }
      .number-management-panel { padding: 20px 16px; }
      .number-request-row,
      .number-direct-form,
      .number-direct-details { grid-template-columns: 1fr; }
      .number-request-actions .btn,
      .number-direct-form .btn,
      .number-direct-details .btn {
        width: 100%;
        min-width: 0;
        min-height: 48px;
      }
    }
  </style>
</head>
<body>

<header id="mainHeader">
  <h1>기분장애 임상평가 설문</h1>
  <div class="header-nav">
    <span id="userBadge" class="user-badge" style="display:none;">의사</span>
    <button id="btnLogout" class="btn secondary sm" style="margin-left:8px;">로그아웃</button>
  </div>
</header>

<div class="container">

  <div id="view-loading" class="view active" style="text-align:center;padding:80px 20px;">
    <div style="width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 20px;"></div>
    <p style="color:var(--text-sub);font-size:15px;">인증 확인 중...</p>
  </div>

  <div id="view-doctor" class="view">
    <div class="doctor-hero">
      <h2 id="doctorName">의사 선생님</h2>
      <div class="doctor-info-bar" id="doctorInfo">
        <span class="info-item">
          <span class="info-label">병원</span>
          <span class="info-value" id="doctorHospital">-</span>
        </span>
        <span class="sep">|</span>
        <span class="info-item">
          <span class="info-label">병원코드</span>
          <span class="info-value" id="doctorHospitalCode">-</span>
        </span>
      </div>
    </div>

    <div class="card doctor-dashboard">
      <section id="patient-search" class="doctor-dashboard-section">
        <div class="doctor-section-header">
          <div>
            <h3>환자 검색</h3>
            <p>현재 병원코드에 등록된 완료 결과를 조회합니다.</p>
          </div>
        </div>
        <div class="form-group">
          <label>의사에게 받은 번호</label>
          <div style="display:flex; gap:10px;">
            <input type="text" id="searchPNum" placeholder="예: 12345" style="margin:0;">
            <button id="btnSearchPatient" class="btn primary" style="width:100px; margin:0;">검색</button>
          </div>
        </div>
        <div id="doctorSearchMsg" class="status-msg"></div>
        <div id="doctorResultArea"></div>
      </section>

      <section id="patient-list" class="doctor-dashboard-section">
        <div class="doctor-section-header">
          <div>
            <h3>환자 목록</h3>
            <p>내 병원에서 완료된 설문 결과입니다.</p>
          </div>
          <button id="btnRefreshPatientList" class="btn secondary sm" type="button">새로고침</button>
        </div>
        <div id="doctorPatientList">
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>병원 데이터를 불러오는 중...</p>
            </div>
          </div>
        </div>
      </section>

      <section id="number-management" class="doctor-dashboard-section">
        <div class="number-management-panel">
          <div class="doctor-section-header">
            <div>
              <h3>의사에게 받은 번호 관리</h3>
              <p>내 병원 환자의 요청을 검토하거나 현재 번호를 직접 조회하여 변경합니다.</p>
            </div>
            <button id="btnRefreshNumberManagement" class="btn secondary sm" type="button">새로고침</button>
          </div>
          <div id="doctorNumberMsg" class="status-msg"></div>

          <div class="number-management-block">
            <h4>환자 변경 요청</h4>
            <p>환자가 직접 제출한 번호 변경 요청을 검토합니다.</p>
            <div id="doctorNumberRequestList" class="number-empty">불러오는 중...</div>
          </div>

          <div class="number-management-block">
            <h4>의사 직접 변경</h4>
            <p>현재 번호로 환자를 확인한 뒤 새 번호를 입력합니다.</p>
            <div class="number-direct-form">
              <div class="form-group">
                <label for="doctorCurrentPatientNumber">현재 의사에게 받은 번호</label>
                <input id="doctorCurrentPatientNumber" type="text" inputmode="numeric" maxlength="8" placeholder="8자리 숫자">
              </div>
              <button id="btnDoctorNumberLookup" class="btn secondary" type="button">조회</button>
            </div>
            <div id="doctorNumberLookupArea"></div>
          </div>
        </div>
      </section>
    </div>

</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  import { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAIL } from "./config.js";
  import { SURVEY_SECTIONS } from "./questions.js";
  import { calculateScores, generateReport, getGlobalInstructions } from "./scoring.js";
  import { renderAnswerRawHTML } from "./answer-view.js";
  import { getAuthSession } from "./auth-session.js";

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let doctorProfile = null;

  const $  = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
  const el = id  => document.getElementById(id);

  function fmtDate(str) {
    if (!str) return "-";
    const d = new Date(str);
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
  }

  function setMsg(elId, msg, type = "info") {
    const el_ = el(elId);
    if (!el_) return;
    el_.className = `status-msg show ${type}`;
    el_.textContent = msg;
    if (type === "ok") setTimeout(() => { el_.className = "status-msg"; }, 3500);
  }
  function clearMsg(elId) {
    const el_ = el(elId); if (el_) el_.className = "status-msg";
  }

  async function invokeNumberManagement(body) {
    const { data, error } = await sb.functions.invoke("manage-patient-number", { body });
    if (!error) return { ok: true, ...(data || {}) };
    let detail = null;
    try { detail = await error.context?.json(); } catch {}
    return {
      ok: false,
      ...(detail || {}),
      error: detail?.error || error.message || "번호 변경 처리에 실패했습니다."
    };
  }

  function showNumberSyncFailure(result) {
    setMsg(
      "doctorNumberMsg",
      "번호는 변경되었지만 후속 저장 처리가 지연되고 있습니다. 관리자에게 문의해 주세요.",
      "error"
    );
  }

  async function loadDoctorNumberRequests() {
    const list = el("doctorNumberRequestList");
    list.className = "number-empty";
    list.textContent = "불러오는 중...";
    const { data, error } = await sb.rpc("list_patient_number_change_requests");
    if (error) {
      list.textContent = "요청을 불러오지 못했습니다.";
      setMsg("doctorNumberMsg", error.message, "error");
      return;
    }
    if (!data?.length) {
      list.textContent = "대기 중인 변경 요청이 없습니다.";
      return;
    }
    list.className = "";
    list.innerHTML = data.map(item => `
      <div class="number-request-row" data-id="${escapeAttr(item.request_id)}">
        <div>
          <strong>${escapeHtml(item.username || "환자")}</strong>
          <div class="number-request-meta">병원코드 ${escapeHtml(item.hospital_code)} · 생년월 ${escapeHtml(item.dob || "-")}<br>${escapeHtml(new Date(item.requested_at).toLocaleString("ko-KR"))}</div>
        </div>
        <div>
          <div class="number-request-value">${escapeHtml(item.old_patient_number)} → ${escapeHtml(item.new_patient_number)}</div>
          <input class="request-note" type="text" maxlength="500" placeholder="검토 메모 (선택)">
        </div>
        <div class="number-request-actions">
          <button class="btn secondary sm doctor-number-review-btn" data-approve="false" type="button">반려</button>
          <button class="btn primary sm doctor-number-review-btn" data-approve="true" type="button">승인</button>
        </div>
      </div>`).join("");
  }

  async function reviewDoctorNumberRequest(row, approve) {
    const label = approve ? "승인" : "반려";
    if (!confirm(`의사에게 받은 번호 변경을 ${label}하시겠습니까?`)) return;
    const buttons = row.querySelectorAll("button");
    buttons.forEach(button => { button.disabled = true; });
    const result = await invokeNumberManagement({
      action: "review",
      requestId: row.dataset.id,
      approve,
      note: row.querySelector(".request-note")?.value.trim() || null
    });
    if (!result.ok) {
      buttons.forEach(button => { button.disabled = false; });
      if (result.databaseUpdated) return showNumberSyncFailure(result);
      return setMsg("doctorNumberMsg", result.error || `${label}하지 못했습니다.`, "error");
    }
    setMsg("doctorNumberMsg", approve ? "번호 변경을 완료했습니다." : "변경 요청을 반려했습니다.", "ok");
    await Promise.all([loadDoctorNumberRequests(), loadDoctorPatientList()]);
  }

  async function lookupDoctorPatientNumber() {
    const current = el("doctorCurrentPatientNumber").value.trim();
    if (!/^\d{8}$/.test(current)) return setMsg("doctorNumberMsg", "현재 번호는 8자리 숫자로 입력하세요.", "error");
    clearMsg("doctorNumberMsg");
    const { data, error } = await sb.rpc("doctor_lookup_patient_number", { p_patient_number: current });
    if (error) return setMsg("doctorNumberMsg", error.message, "error");
    const patient = data?.[0];
    if (!patient) {
      el("doctorNumberLookupArea").innerHTML = "";
      return setMsg("doctorNumberMsg", "내 병원에서 해당 환자 계정을 찾을 수 없습니다.", "warn");
    }
    el("doctorNumberLookupArea").innerHTML = `
      <div class="number-patient-summary">
        <strong>${escapeHtml(patient.username || "환자")}</strong> · 병원코드 ${escapeHtml(patient.hospital_code)} · 현재 번호 ${escapeHtml(patient.patient_number)} · 생년월 ${escapeHtml(patient.dob || "-")} · 완료 결과 ${escapeHtml(patient.completed_results || 0)}건
      </div>
      <div class="number-direct-details">
        <div class="form-group">
          <label for="doctorNewPatientNumber">새 의사에게 받은 번호</label>
          <input id="doctorNewPatientNumber" type="text" inputmode="numeric" maxlength="8" placeholder="8자리 숫자">
        </div>
        <div class="form-group">
          <label for="doctorNumberChangeNote">변경 사유</label>
          <input id="doctorNumberChangeNote" type="text" maxlength="500" placeholder="선택 입력">
        </div>
        <button id="btnDoctorNumberChange" class="btn primary" type="button">변경</button>
      </div>`;
  }

  async function changeDoctorPatientNumber() {
    const current = el("doctorCurrentPatientNumber").value.trim();
    const next = el("doctorNewPatientNumber")?.value.trim() || "";
    const note = el("doctorNumberChangeNote")?.value.trim() || null;
    if (!/^\d{8}$/.test(current) || !/^\d{8}$/.test(next)) {
      return setMsg("doctorNumberMsg", "현재 번호와 새 번호를 8자리 숫자로 입력하세요.", "error");
    }
    if (!confirm(`${current} 번호를 ${next} 번호로 변경하시겠습니까?`)) return;
    const button = el("btnDoctorNumberChange");
    button.disabled = true;
    button.textContent = "변경 중...";
    const result = await invokeNumberManagement({
      action: "change",
      currentPatientNumber: current,
      newPatientNumber: next,
      note
    });
    button.disabled = false;
    button.textContent = "변경";
    if (!result.ok) {
      if (result.databaseUpdated) return showNumberSyncFailure(result);
      return setMsg("doctorNumberMsg", result.error || "번호를 변경하지 못했습니다.", "error");
    }
    el("doctorCurrentPatientNumber").value = next;
    el("doctorNumberLookupArea").innerHTML = "";
    setMsg("doctorNumberMsg", "의사에게 받은 번호를 변경했습니다.", "ok");
    await Promise.all([loadDoctorNumberRequests(), loadDoctorPatientList()]);
  }

  function show(id) {
    $$(".view").forEach(v => v.classList.remove("active"));
    const target = el(id);
    if (target) { target.classList.add("active"); window.scrollTo(0, 0); }
  }

  function escapeHtml(str) {
    if (str == null) return "";
    const div = document.createElement("div");
    div.textContent = String(str);
    return div.innerHTML;
  }

  function escapeAttr(str) {
    if (str == null) return "";
    return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function safeReportColor(value) {
    const color = String(value || "");
    return /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : "inherit";
  }

  function reportRankColor(rank, storedColor) {
    const value = Number(rank);
    if (!Number.isFinite(value)) return safeReportColor(storedColor);
    if (value < 50) return "#FF5C7A";
    if (value > 50) return "#2B3CFF";
    return "#5F6368";
  }

  function renderReportHTML(report, container) {
    if (!container || !report) return;

    function fmtScore(val) {
      if (val === undefined || val === null) return "-";
      if (typeof val === 'number') return Number.isInteger(val) ? String(val) : parseFloat(val.toFixed(2)).toString();
      return String(val);
    }

    function fmtRank(r) {
      return typeof r === "number" ? r + "등" : (r || "-");
    }

    const sections = report.sections || [];

    container.innerHTML = sections.map(section => {
      const groups = section.groups || [];

      let groupsHTML = groups.map(group => {
        let html = "";

        if (group.label && group.type !== "comorbidity") {
          html += `<div class="group-label">${escapeHtml(group.label)}</div>`;
        }

        if (group.description) {
          html += `<div class="section-desc-block">${escapeHtml(group.description)}</div>`;
        }

        if (group.type === "comorbidity") {
          const items = group.items || [];
          html += `<div class="group-label">${escapeHtml(group.label)}</div>`;
          html += `<table class="result-table comorbidity-table"><tbody>`;
          items.forEach(item => {
            const cls = item.value === 'O' ? 'comorbid-positive' : 'comorbid-negative';
            html += `<tr><td class="comorbid-name">${escapeHtml(item.name)}</td><td class="comorbid-val ${cls}">${escapeHtml(item.value)}</td></tr>`;
          });
          html += `</tbody></table>`;
          return html;
        }

        const rows = group.rows || [];
        if (rows.length === 0) return html;

        const hasSpecial = rows.some(r => r.specialCols);

        if (hasSpecial) {
          html += `<div class="result-table-wrap"><table class="result-table">
            <thead><tr>
              <th class="col-name">검사명</th>
              <th class="col-score">결과</th>
              <th class="col-score">점수</th>
              <th class="col-rank">환자비교백분위</th>
              <th class="col-rank">정상군비교백분위</th>
            </tr></thead>
            <tbody>`;
          rows.forEach(r => {
            const name = escapeHtml(r.name);
            const subCls = r.sub ? " sub-item" : "";
            if (r.textOnly) {
              html += `<tr><td class="name-cell${subCls}">${name}</td><td class="score-cell" colspan="4">${escapeHtml(fmtScore(r.score))}</td></tr>`;
            } else if (r.specialCols) {
              const pRank = fmtRank(r.pat_rank);
              const nRank = fmtRank(r.nor_rank);
              html += `<tr>
                <td class="name-cell${subCls}">${name}</td>
                <td class="score-cell">${escapeHtml(r.extra)}</td>
                <td class="score-cell">${escapeHtml(fmtScore(r.score))}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.pat_rank, r.pat_color)}">${escapeHtml(pRank)}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.nor_rank, r.nor_color)}">${escapeHtml(nRank)}</td>
              </tr>`;
              if (r.description) {
                html += `<tr class="desc-row"><td colspan="5" class="desc-cell-block">${escapeHtml(r.description)}</td></tr>`;
              }
            } else {
              const pRank = fmtRank(r.pat_rank);
              const nRank = fmtRank(r.nor_rank);
              html += `<tr>
                <td class="name-cell${subCls}">${name}</td>
                <td class="score-cell" colspan="2">${escapeHtml(fmtScore(r.score))}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.pat_rank, r.pat_color)}">${escapeHtml(pRank)}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.nor_rank, r.nor_color)}">${escapeHtml(nRank)}</td>
              </tr>`;
              if (!r.sub && r.description) {
                html += `<tr class="desc-row"><td colspan="5" class="desc-cell-block">${escapeHtml(r.description)}</td></tr>`;
              }
            }
          });
          html += `</tbody></table></div>`;
        } else {
          html += `<div class="result-table-wrap"><table class="result-table">
            <thead><tr>
              <th class="col-name">검사명</th>
              <th class="col-score">응답결과</th>
              <th class="col-rank">환자비교백분위</th>
              <th class="col-rank">정상군비교백분위</th>
            </tr></thead>
            <tbody>`;
          rows.forEach(r => {
            const name = escapeHtml(r.name);
            const subCls = r.sub ? " sub-item" : "";
            if (r.textOnly) {
              html += `<tr><td class="name-cell${subCls}">${name}</td><td class="score-cell" colspan="3">${escapeHtml(fmtScore(r.score))}</td></tr>`;
            } else {
              const pRank = fmtRank(r.pat_rank);
              const nRank = fmtRank(r.nor_rank);
              html += `<tr>
                <td class="name-cell${subCls}">${name}</td>
                <td class="score-cell">${escapeHtml(fmtScore(r.score))}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.pat_rank, r.pat_color)}">${escapeHtml(pRank)}</td>
                <td class="rank-cell" style="color:${reportRankColor(r.nor_rank, r.nor_color)}">${escapeHtml(nRank)}</td>
              </tr>`;
              if (!r.sub && r.description) {
                html += `<tr class="desc-row"><td colspan="4" class="desc-cell-block">${escapeHtml(r.description)}</td></tr>`;
              }
            }
          });
          html += `</tbody></table></div>`;
        }

        return html;
      }).join("");

      return `
        <div class="result-category">
          <div class="result-section-title">${escapeHtml(section.title)}</div>
          ${groupsHTML}
        </div>`;
    }).join("");
  }

  function renderDoctorResult(row, container) {
    let report = row.report;
    if (row.answers) {
      try {
        const scores = calculateScores(row.answers);
        report = generateReport(scores, row.answers);
      } catch (e) { console.error("재계산 실패:", e); }
    }
    if (!report) {
      container.innerHTML = `<p class="text-sub" style="padding:20px 0;">결과 데이터가 없습니다.</p>`;
      return;
    }

    const instructions = (report && report.instructions) ? report.instructions : getGlobalInstructions();
    const dateStr = fmtDate(row.completed_at);
    const patNum = row.assessment_key || row.patient_number || "-";

    container.innerHTML = `
      <div class="patient-result-card">
        <div class="divider" style="margin-top:0;"></div>
        <div class="result-header-block">
          <h2 class="report-main-title">기분장애 임상평가 결과지</h2>
          <p class="report-date-line">${escapeHtml(dateStr)}&nbsp;&nbsp;번호: ${escapeHtml(patNum)}</p>
        </div>
        <details open style="margin-bottom:24px;">
          <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);padding:12px 16px;background:var(--accent-light);border-radius:10px;">
            📋 결과 해석 안내
          </summary>
          <div class="result-instructions" style="margin-top:8px;">${escapeHtml(instructions)}</div>
        </details>
        <div id="drReportContent"></div>
        <div class="print-btn-wrap">
          <button class="btn secondary sm btn-dr-pdf" data-patnum="${escapeAttr(patNum)}" data-date="${escapeAttr(dateStr)}">📄 PDF 다운로드</button>
          <button class="btn primary sm" onclick="window.print()">🖨️ 인쇄</button>
        </div>
      </div>`;

    const content = el("drReportContent");
    renderReportHTML(report, content);
    content.insertAdjacentHTML("beforeend", renderAnswerRawHTML(row.answers || {}));
  }

  async function searchPatient() {
    const requested = el("searchPNum").value.trim();
    const parsed = requested.match(/^(\d{8})(?:-(\d+))?$/);
    if (!parsed) return alert("8자리 의사에게 받은 번호 또는 번호-회차를 입력하세요.");
    const pNum = parsed[1];
    const requestedAssessment = parsed[2] ? Number(parsed[2]) : null;
    setMsg("doctorSearchMsg", "검색 중...", "info");
    el("doctorResultArea").innerHTML = "";

    const { data, error } = await sb.rpc("doctor_get_patient_results", { p_patient_number: pNum });
    if (error) { setMsg("doctorSearchMsg", "오류: " + error.message, "error"); return; }

    if (!data || !data.length) {
      setMsg("doctorSearchMsg", `'${pNum}' 에 해당하는 완료된 결과가 없습니다.`, "warn");
      return;
    }

    clearMsg("doctorSearchMsg");
    const row = requestedAssessment
      ? data.find(item => item.assessment_no === requestedAssessment)
      : data[0];
    if (!row) {
      setMsg("doctorSearchMsg", `'${requested}' 에 해당하는 완료된 결과가 없습니다.`, "warn");
      return;
    }
    renderDoctorResult(row, el("doctorResultArea"));
  }

  async function loadDoctorPatientList() {
    const list = el("doctorPatientList");
    if (!list) return;
    list.innerHTML = `<div class="patient-list-loading"><span class="spinner-small"></span>로딩 중...</div>`;

    const { data, error } = await sb.rpc("doctor_list_patients");

    if (error || !data?.length) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">📭</div>
        <p>완료된 설문이 없습니다.</p>
        <div class="sub">아직 해당 병원에서 완료된 설문 결과가 없습니다.</div>
      </div>`;
      return;
    }

    list.innerHTML = data.map(r => `
      <div class="history-item" data-response-id="${escapeAttr(r.id)}" style="cursor:pointer;">
        <div class="history-dot"></div>
        <div class="history-info">
          <div class="history-date">번호: ${escapeHtml(r.assessment_key || r.patient_number || "미입력")}</div>
          <div class="history-sub">완료: ${escapeHtml(fmtDate(r.completed_at))}</div>
        </div>
        <button class="btn secondary sm" data-view-id="${escapeAttr(r.id)}">결과보기</button>
      </div>`).join("");

    list.querySelectorAll('[data-view-id]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const responseId = btn.dataset.viewId;
        await viewResponseById(responseId);
      });
    });
  }

  async function viewResponseById(responseId) {
    const { data, error } = await sb.from("survey_responses").select("*").eq("id", responseId).single();
    if (error || !data) return alert("결과를 찾을 수 없습니다.");

    if (data?.answers) {
      try {
        const scores = calculateScores(data.answers);
        data.report = generateReport(scores, data.answers);
      } catch (e) { console.error("재계산 실패:", e); }
    }
    if (!data?.report) return alert("결과를 찾을 수 없습니다.");

    const area = el("doctorResultArea");
    area.innerHTML = "";
    renderDoctorResult(data, area);

    el("searchPNum").value = data.assessment_key || data.patient_number || "";
    area.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function initDoctor(profile) {
    doctorProfile = profile;
    show("view-doctor");

    el("doctorName").textContent = `${profile.doctor_name || profile.username || "의사"} 선생님`;
    el("doctorHospital").textContent = profile.hospital_name || "-";
    el("doctorHospitalCode").textContent = profile.hospital_code || "없음";
    el("userBadge").style.display = "block";

    Promise.all([
      loadDoctorPatientList(),
      loadDoctorNumberRequests()
    ]).then(() => {
      const tab = new URLSearchParams(window.location.search).get("tab");
      const target = tab === "list" ? el("patient-list") : tab === "search" ? el("patient-search") : null;
      target?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  el("btnSearchPatient")?.addEventListener("click", searchPatient);
  el("searchPNum")?.addEventListener("keydown", e => { if (e.key === "Enter") searchPatient(); });
  el("btnRefreshPatientList")?.addEventListener("click", loadDoctorPatientList);
  el("btnRefreshNumberManagement")?.addEventListener("click", loadDoctorNumberRequests);
  el("btnDoctorNumberLookup")?.addEventListener("click", lookupDoctorPatientNumber);
  el("doctorCurrentPatientNumber")?.addEventListener("keydown", event => {
    if (event.key === "Enter") lookupDoctorPatientNumber();
  });
  el("doctorNumberLookupArea")?.addEventListener("click", event => {
    if (event.target.closest("#btnDoctorNumberChange")) changeDoctorPatientNumber();
  });
  el("doctorNumberRequestList")?.addEventListener("click", event => {
    const button = event.target.closest(".doctor-number-review-btn");
    if (!button) return;
    reviewDoctorNumberRequest(button.closest(".number-request-row"), button.dataset.approve === "true");
  });
  el("btnLogout")?.addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });

  async function initializeDoctorSession() {
    const session = await getAuthSession(sb);

    const user = session?.user;
    if (!user) {
      window.location.href = "login.html?role=doctor";
      return;
    }
    if (user.email?.toLowerCase() === ADMIN_EMAIL) {
      window.location.href = "admin.html";
      return;
    }

    let prof = null;
    for (let i = 0; i < 5; i++) {
      const endpoint = new URL(`${SUPABASE_URL}/rest/v1/profiles`);
      endpoint.searchParams.set("select", "id,role,email,username,doctor_name,hospital_name,hospital_code");
      endpoint.searchParams.set("id", `eq.${user.id}`);
      const response = await fetch(endpoint, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}` }
      });
      if (response.ok) {
        const rows = await response.json();
        if (rows[0]) { prof = rows[0]; break; }
      }
      if (i < 4) await new Promise(resolve => setTimeout(resolve, 500));
    }

    if (!prof) {
      window.location.href = "login.html?role=doctor";
      return;
    }
    if (prof.role !== "doctor") {
      if (prof.role === "patient") window.location.href = "respondent.html";
      else if (prof.role === "doctor_pending") window.location.href = "signup-doctor.html?pending=1";
      else if (prof.role === "doctor_revoked") window.location.href = "signup-doctor.html?revoked=1";
      else window.location.href = "login.html?role=doctor";
      return;
    }

    initDoctor(prof);
  }

  sb.auth.onAuthStateChange(event => {
    if (event === "SIGNED_OUT") window.location.href = "login.html?role=doctor";
  });
  initializeDoctorSession().catch(() => {
    window.location.href = "login.html?role=doctor";
  });
</script>

<!-- html2pdf.js (클라이언트 PDF 생성) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
<script>
async function saveNodeAsFittedPdf(node, filename) {
  if (!window.html2canvas || !window.jspdf?.jsPDF) {
    throw new Error("PDF 생성 라이브러리를 불러오지 못했습니다.");
  }
  const canvas = await window.html2canvas(node, {
    scale: 2,
    useCORS: true,
    logging: false,
    backgroundColor: "#ffffff",
    windowWidth: 1320,
    scrollX: 0,
    scrollY: 0
  });
  const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 8;
  const contentWidth = pageWidth - margin * 2;
  const contentHeight = pageHeight - margin * 2;
  const sliceHeight = Math.floor(canvas.width * contentHeight / contentWidth);
  let sourceY = 0;
  let pageIndex = 0;

  while (sourceY < canvas.height) {
    const currentSliceHeight = Math.min(sliceHeight, canvas.height - sourceY);
    const pageCanvas = document.createElement("canvas");
    pageCanvas.width = canvas.width;
    pageCanvas.height = currentSliceHeight;
    pageCanvas.getContext("2d").drawImage(
      canvas,
      0, sourceY, canvas.width, currentSliceHeight,
      0, 0, canvas.width, currentSliceHeight
    );
    if (pageIndex > 0) pdf.addPage();
    const imageHeight = currentSliceHeight * contentWidth / canvas.width;
    pdf.addImage(pageCanvas.toDataURL("image/jpeg", 0.98), "JPEG", margin, margin, contentWidth, imageHeight);
    sourceY += currentSliceHeight;
    pageIndex += 1;
  }
  pdf.save(filename);
}

document.addEventListener("click", function (e) {
  const btn = e.target.closest(".btn-dr-pdf");
  if (!btn) return;

  const card = btn.closest(".patient-result-card");
  if (!card) return;

  btn.disabled = true;
  btn.textContent = "⏳ 생성 중...";

  const patNum = btn.dataset.patnum || "result";
  const dateStr = (btn.dataset.date || new Date().toISOString().slice(0, 10)).replace(/\s+/g, "_");
  const pdfNode = card.cloneNode(true);
  pdfNode.classList.add("pdf-export");
  pdfNode.querySelectorAll(".raw-answer-view").forEach(n => n.remove());
  pdfNode.querySelectorAll("details").forEach(d => { d.open = true; });
  Object.assign(pdfNode.style, {
    position: "absolute",
    left: "0",
    top: "0",
    zIndex: "-1",
    background: "#ffffff"
  });
  document.body.appendChild(pdfNode);
  const oldScroll = window.scrollY;
  window.scrollTo(0, 0);

  saveNodeAsFittedPdf(pdfNode, `Self_Report_Survey_Result_${dateStr}_${patNum}.pdf`)
    .then(() => {
      pdfNode.remove();
      window.scrollTo(0, oldScroll);
      btn.textContent = "✅ PDF 완료";
      setTimeout(() => { btn.disabled = false; btn.textContent = "📄 PDF 다운로드"; }, 2000);
    })
    .catch(() => {
      pdfNode.remove();
      window.scrollTo(0, oldScroll);
      btn.textContent = "❌ 오류";
      setTimeout(() => { btn.disabled = false; btn.textContent = "📄 PDF 다운로드"; }, 3000);
    });
});
</script>
