<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>관리자 대시보드 – 기분장애 임상평가 설문</title>
  <link rel="stylesheet" href="styles.css">
  <style>

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .admin-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }
    .admin-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--text-main);
    }
    .section-header .list-section-title {
      margin: 0;
      padding: 0;
      border-bottom: none;
    }
    .section-body {
      margin-bottom: 36px;
    }
    .admin-empty {
      padding: 24px 0;
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
    }
    .admin-loading {
      padding: 20px 0;
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
    }
    .admin-error {
      padding: 16px;
      background: var(--red-bg);
      color: var(--red);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .admin-oauth-note {
      margin: 0 0 18px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
    .google-mark {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: #1a73e8;
      font-weight: 800;
      line-height: 1;
    }

    @media (max-width: 600px) {
      .admin-header { flex-direction: column; align-items: stretch; }
      .admin-header-actions { justify-content: stretch; }
      .admin-header-actions .btn { flex: 1; min-width: 0; }
      .list-row { flex-direction: column; align-items: flex-start; gap: 10px; }
      .list-actions { align-self: stretch; }
      .list-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>

<header id="mainHeader">
  <h1>기분장애 임상평가 설문 – 관리자</h1>
  <div class="header-nav">
    <a href="admin.html" class="active">대시보드</a>
    <a href="admin.html#pending">승인대기</a>
    <a href="admin.html#doctors">의사관리</a>
    <a href="patient-number-requests.html">의사에게 받은 번호 변경</a>
    <span id="userBadge" class="user-badge" style="display:none;">관리자</span>
    <button id="btnLogout" class="btn secondary sm" style="display:none;margin-left:8px;">로그아웃</button>
  </div>
</header>

<div class="container">

  <div id="view-auth" class="view active">
    <div class="card" style="max-width:440px; margin:0 auto;">
      <h2 class="card-title text-center" style="text-align:center;">관리자 로그인</h2>
      <p class="admin-oauth-note">등록된 관리자 Google 계정으로만 접속할 수 있습니다.</p>
      <div id="authMsg" class="status-msg"></div>

  <div id="view-admin" class="view">
    <div class="card">
      <div class="admin-header">

        <div class="admin-header-actions">
          <button id="btnAdminRefresh" class="btn primary sm" style="min-width:80px;">🔄 새로고침</button>
        </div>
      </div>

      <div class="section-body">
        <div class="section-header">
          <div class="list-section-title">승인 대기 의사</div>
          <button id="btnRefreshPending" class="btn secondary sm" style="min-width:70px;">새로고침</button>
        </div>
        <div id="adminPendingList"></div>
      </div>

      <div class="section-body">
        <div class="section-header">
          <div class="list-section-title">등록된 의사 목록</div>
          <button id="btnRefreshDoctors" class="btn secondary sm" style="min-width:70px;">새로고침</button>
        </div>
        <div id="adminDoctorList"></div>
      </div>

      <div class="section-body">
        <div class="section-header">
          <div class="list-section-title">승인취소 의사</div>
          <button id="btnRefreshRevokedDoctors" class="btn secondary sm" style="min-width:70px;">새로고침</button>
        </div>
        <div id="adminRevokedDoctorList"></div>
      </div>

      <div class="section-body">
        <div class="section-header">
          <div class="list-section-title">환자 결과 조회</div>
        </div>
        <div class="form-row" style="max-width:640px;align-items:flex-end;">
          <div class="form-group">
            <label>병원 코드</label>
            <input type="text" id="adminSearchHCode" placeholder="예: SNUBH01" autocomplete="off">
          </div>
          <div class="form-group">
            <label>의사에게 받은 번호</label>
            <input type="text" id="adminSearchPNum" placeholder="예: 36496934" autocomplete="off">
          </div>
          <button id="btnAdminSearchResult" class="btn primary sm" style="min-width:72px;margin-bottom:16px;">검색</button>
        </div>
        <div id="adminResultMsg" class="status-msg"></div>
        <div id="adminResultArea"></div>
      </div>
    </div>
  </div>

</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
  <script type="module">

  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
  import { signInAdminWithGoogle, validateAdminSession } from "./admin-auth.js";
  import { calculateScores, generateReport, getGlobalInstructions } from "./scoring.js";
  import { renderAnswerRawHTML } from "./answer-view.js";

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $  = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
  const el = id  => document.getElementById(id);

  async function saveNodeAsFittedPdf(node, filename) {
    if (!window.html2canvas || !window.jspdf?.jsPDF) {
      throw new Error("PDF 생성 라이브러리를 불러오지 못했습니다.");
    }
    const canvas = await window.html2canvas(node, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: "#ffffff",
      windowWidth: 1320,
      scrollX: 0,
      scrollY: 0
    });
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pageWidth = 210;
    const pageHeight = 297;
    const margin = 8;
    const contentWidth = pageWidth - margin * 2;
    const contentHeight = pageHeight - margin * 2;
    const sliceHeight = Math.floor(canvas.width * contentHeight / contentWidth);
    let sourceY = 0;
    let pageIndex = 0;

    while (sourceY < canvas.height) {
      const currentSliceHeight = Math.min(sliceHeight, canvas.height - sourceY);
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = currentSliceHeight;
      pageCanvas.getContext("2d").drawImage(
        canvas,
        0, sourceY, canvas.width, currentSliceHeight,
        0, 0, canvas.width, currentSliceHeight
      );
      if (pageIndex > 0) pdf.addPage();
      const imageHeight = currentSliceHeight * contentWidth / canvas.width;
      pdf.addImage(pageCanvas.toDataURL("image/jpeg", 0.98), "JPEG", margin, margin, contentWidth, imageHeight);
      sourceY += currentSliceHeight;
      pageIndex += 1;
    }
    pdf.save(filename);
  }

  function showView(id) {
    $$(".view").forEach(v => v.classList.remove("active"));
    const target = el(id);
    if (target) { target.classList.add("active"); window.scrollTo(0, 0); }
  }

  function setMsg(id, msg, type = "info") {
    const el_ = el(id);
    if (!el_) return;
    el_.className = `status-msg show ${type}`;
    el_.textContent = msg;
    if (type === "ok") setTimeout(() => { el_.className = "status-msg"; }, 3500);
  }

  function clearMsg(id) {
    const el_ = el(id);
    if (el_) el_.className = "status-msg";
  }

  const state = { user: null, session: null };

  function oauthErrorMessage() {
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    return query.get("error_description") || hash.get("error_description") || "";
  }

  async function checkSession() {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) { console.error("Session error:", error); return null; }
    const validation = await validateAdminSession(sb, session);
    if (validation.ok) {
      state.user = validation.user;
      state.session = session;
      showView("view-admin");
      el("userBadge").style.display = "inline";
      el("userBadge").textContent = "관리자";
      el("btnLogout").style.display = "inline-flex";
      await loadAdminPending();
      await loadAdminDoctors();
      await loadAdminRevokedDoctors();
      return session;
    }

    if (session) {
      await sb.auth.signOut({ scope: "local" });
    }
    showView("view-auth");
    const oauthError = oauthErrorMessage();
    if (oauthError) setMsg("authMsg", "Google 로그인 실패: " + oauthError, "error");
    else if (session) setMsg("authMsg", validation.reason, "error");
    return null;
  }

  el("btnGoogleLogin").addEventListener("click", async () => {
    clearMsg("authMsg");
    const button = el("btnGoogleLogin");
    button.disabled = true;
    const previousText = button.innerHTML;
    button.textContent = "Google 로그인으로 이동 중...";
    const { error } = await signInAdminWithGoogle(sb);
    if (error) {
      button.disabled = false;
      button.innerHTML = previousText;
      setMsg("authMsg", "Google 로그인을 시작하지 못했습니다: " + error.message, "error");
    }
  });

  el("btnLogout").addEventListener("click", async () => {
    await sb.auth.signOut();
    state.user = null;
    state.session = null;
    el("userBadge").style.display = "none";
    el("btnLogout").style.display = "none";
    showView("view-auth");
  });

  async function loadAdminPending() {
    const list = el("adminPendingList");
    if (!list) return;
    list.innerHTML = `<div class="admin-loading">로딩 중...</div>`;
    const { data, error } = await sb
      .from("profiles")
      .select("*")
      .eq("role", "doctor_pending")
      .order("created_at", { ascending: true });
    if (error) {
      list.innerHTML = `<div class="admin-error">오류: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      list.innerHTML = `<div class="admin-empty">대기 중인 의사가 없습니다.</div>`;
      return;
    }
    list.innerHTML = data.map(d => `
      <div class="list-row">
        <div class="list-info">
          <div class="name">${escapeHtml(d.doctor_name) || "-"}</div>
          <div class="sub">${escapeHtml(d.hospital_name) || "-"} &nbsp;|&nbsp; ${escapeHtml(d.email) || "-"}</div>
        </div>
        <div class="list-actions">
          <button class="btn primary sm approve-btn" data-id="${d.id}" data-name="${escapeAttr(d.doctor_name)}">승인</button>
        </div>
      </div>`).join("");
  }

  async function loadAdminDoctors() {
    const list = el("adminDoctorList");
    if (!list) return;
    list.innerHTML = `<div class="admin-loading">로딩 중...</div>`;
    const { data, error } = await sb
      .from("profiles")
      .select("*")
      .eq("role", "doctor")
      .order("doctor_name", { ascending: true });
    if (error) {
      list.innerHTML = `<div class="admin-error">오류: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      list.innerHTML = `<div class="admin-empty">등록된 의사가 없습니다.</div>`;
      return;
    }
    list.innerHTML = data.map(d => {
      return `
      <div class="list-row">
        <div class="list-info">
          <div class="name" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${escapeHtml(d.doctor_name) || "-"}
            <span class="badge green">승인됨</span>
            <span class="badge gray">${escapeHtml(d.hospital_code) || "코드없음"}</span>
          </div>
          <div class="sub">${escapeHtml(d.hospital_name) || "-"}</div>
        </div>
        <div class="list-actions">
          <button class="btn secondary sm revoke-btn" data-id="${d.id}" data-name="${escapeAttr(d.doctor_name)}">승인취소</button>
          <button class="btn secondary sm reset-btn" data-id="${d.id}">비밀번호 초기화</button>
        </div>
      </div>`;
    }).join("");
  }

  async function loadAdminRevokedDoctors() {
    const list = el("adminRevokedDoctorList");
    if (!list) return;
    list.innerHTML = `<div class="admin-loading">로딩 중...</div>`;
    const { data, error } = await sb
      .from("profiles")
      .select("*")
      .eq("role", "doctor_revoked")
      .order("doctor_name", { ascending: true });
    if (error) {
      list.innerHTML = `<div class="admin-error">오류: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      list.innerHTML = `<div class="admin-empty">승인취소된 의사가 없습니다.</div>`;
      return;
    }
    list.innerHTML = data.map(d => `
      <div class="list-row">
        <div class="list-info">
          <div class="name" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${escapeHtml(d.doctor_name) || "-"}
            <span class="badge red">승인취소</span>
            <span class="badge gray">${escapeHtml(d.hospital_code) || "코드없음"}</span>
          </div>
          <div class="sub">${escapeHtml(d.hospital_name) || "-"} &nbsp;|&nbsp; ${escapeHtml(d.email) || "-"}</div>
        </div>
        <div class="list-actions">
          <button class="btn primary sm approve-btn" data-id="${d.id}" data-name="${escapeAttr(d.doctor_name)}">다시 승인</button>
          <button class="btn secondary sm reset-btn" data-id="${d.id}">비밀번호 초기화</button>
        </div>
      </div>`).join("");
  }

  document.addEventListener("click", async (e) => {

    if (e.target.matches(".approve-btn")) {
      const id = e.target.dataset.id;
      const name = e.target.dataset.name || "해당";
      if (!confirm(`${name} 의사를 승인하시겠습니까?`)) return;
      e.target.disabled = true;
      e.target.textContent = "처리 중...";
      const { error } = await sb.rpc("approve_doctor", { p_doctor_id: id });
      e.target.disabled = false;
      e.target.textContent = "승인";
      if (error) {
        alert("승인 오류: " + error.message);
        return;
      }
      alert("승인 완료!");
      await loadAdminPending();
      await loadAdminDoctors();
      await loadAdminRevokedDoctors();
      return;
    }

    if (e.target.matches(".revoke-btn")) {
      const id = e.target.dataset.id;
      const name = e.target.dataset.name || "해당";
      if (!confirm(`${name} 의사의 승인을 취소하시겠습니까? 기존 병원코드와 결과 DB는 유지됩니다.`)) return;
      e.target.disabled = true;
      e.target.textContent = "처리 중...";
      const { error } = await sb.rpc("revoke_doctor_approval", { p_doctor_id: id });
      e.target.disabled = false;
      e.target.textContent = "승인취소";
      if (error) {
        alert("승인취소 오류: " + error.message);
        return;
      }
      alert("승인취소 완료");
      await loadAdminPending();
      await loadAdminDoctors();
      await loadAdminRevokedDoctors();
      return;
    }

    if (e.target.matches(".reset-btn")) {
      const id = e.target.dataset.id;
      const newPw = generateTemporaryPassword();
      if (!confirm("이 의사의 비밀번호를 안전한 임시 비밀번호로 초기화하시겠습니까?")) return;
      e.target.disabled = true;
      e.target.textContent = "처리 중...";
      const { error } = await sb.rpc("admin_reset_password", {
        target_user_id: id,
        new_password: newPw
      });
      e.target.disabled = false;
      e.target.textContent = "비밀번호 초기화";
      if (error) {
        alert("오류: " + error.message);
      } else {
        alert(`비밀번호 초기화 완료\n\n임시 비밀번호: ${newPw}\n\n이 값은 다시 표시되지 않습니다. 의사에게 안전한 경로로 전달하고 로그인 후 변경하도록 안내하세요.`);
      }
      return;
    }
  });

  async function refreshAll() {
    const btn = el("btnAdminRefresh");
    btn.disabled = true;
    btn.textContent = "로딩 중...";
    await Promise.all([loadAdminPending(), loadAdminDoctors(), loadAdminRevokedDoctors()]);
    btn.textContent = "🔄 새로고침";
    btn.disabled = false;
  }

  el("btnAdminRefresh")?.addEventListener("click", refreshAll);

  el("btnRefreshPending")?.addEventListener("click", async () => {
    const btn = el("btnRefreshPending");
    btn.disabled = true;
    btn.textContent = "로딩 중...";
    await loadAdminPending();
    btn.textContent = "새로고침";
    btn.disabled = false;
  });

  el("btnRefreshRevokedDoctors")?.addEventListener("click", async () => {
    const btn = el("btnRefreshRevokedDoctors");
    btn.disabled = true;
    btn.textContent = "로딩 중...";
    await loadAdminRevokedDoctors();
    btn.textContent = "새로고침";
    btn.disabled = false;
  });

  el("btnRefreshDoctors")?.addEventListener("click", async () => {
    const btn = el("btnRefreshDoctors");
    btn.disabled = true;
    btn.textContent = "로딩 중...";
    await loadAdminDoctors();
    btn.textContent = "새로고침";
    btn.disabled = false;
  });

  function fmtDate(d) {
    if (!d) return "";
    try {
      return new Date(d).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
    } catch { return String(d); }
  }

  function renderReportHTML(report, container) {
    if (!container || !report) return;
    const fmtScore = val => {
      if (val === undefined || val === null) return "-";
      if (typeof val === "number") return Number.isInteger(val) ? String(val) : parseFloat(val.toFixed(2)).toString();
      return String(val);
    };
    const fmtRank = r => typeof r === "number" ? r + "등" : (r || "-");

    container.innerHTML = (report.sections || []).map(section => {
      const groupsHTML = (section.groups || []).map(group => {
        let html = "";
        if (group.label && group.type !== "comorbidity") html += `<div class="group-label">${escapeHtml(group.label)}</div>`;
        if (group.description) html += `<div class="section-desc-block">${escapeHtml(group.description)}</div>`;
        if (group.type === "comorbidity") {
          html += `<div class="group-label">${escapeHtml(group.label)}</div><table class="result-table comorbidity-table"><tbody>`;
          (group.items || []).forEach(item => {
            const cls = item.value === "O" ? "comorbid-positive" : "comorbid-negative";
            html += `<tr><td class="comorbid-name">${escapeHtml(item.name)}</td><td class="comorbid-val ${cls}">${escapeHtml(item.value)}</td></tr>`;
          });
          return html + `</tbody></table>`;
        }
        const rows = group.rows || [];
        if (!rows.length) return html;
        const hasSpecial = rows.some(r => r.specialCols);
        html += `<div class="result-table-wrap"><table class="result-table"><thead><tr>`;
        html += hasSpecial
          ? `<th class="col-name">검사명</th><th class="col-score">결과</th><th class="col-score">점수</th><th class="col-rank">환자비교백분위</th><th class="col-rank">정상군비교백분위</th>`
          : `<th class="col-name">검사명</th><th class="col-score">응답결과</th><th class="col-rank">환자비교백분위</th><th class="col-rank">정상군비교백분위</th>`;
        html += `</tr></thead><tbody>`;
        rows.forEach(r => {
          const subCls = r.sub ? " sub-item" : "";
          if (r.textOnly) {
            html += `<tr><td class="name-cell${subCls}">${escapeHtml(r.name)}</td><td class="score-cell" colspan="${hasSpecial ? 4 : 3}">${escapeHtml(fmtScore(r.score))}</td></tr>`;
          } else if (hasSpecial) {
            html += `<tr><td class="name-cell${subCls}">${escapeHtml(r.name)}</td><td class="score-cell">${escapeHtml(r.extra)}</td><td class="score-cell">${escapeHtml(fmtScore(r.score))}</td><td class="rank-cell" style="color:${reportRankColor(r.pat_rank, r.pat_color)}">${escapeHtml(fmtRank(r.pat_rank))}</td><td class="rank-cell" style="color:${reportRankColor(r.nor_rank, r.nor_color)}">${escapeHtml(fmtRank(r.nor_rank))}</td></tr>`;
            if (r.description) html += `<tr class="desc-row"><td colspan="5" class="desc-cell-block">${escapeHtml(r.description)}</td></tr>`;
          } else {
            html += `<tr><td class="name-cell${subCls}">${escapeHtml(r.name)}</td><td class="score-cell">${escapeHtml(fmtScore(r.score))}</td><td class="rank-cell" style="color:${reportRankColor(r.pat_rank, r.pat_color)}">${escapeHtml(fmtRank(r.pat_rank))}</td><td class="rank-cell" style="color:${reportRankColor(r.nor_rank, r.nor_color)}">${escapeHtml(fmtRank(r.nor_rank))}</td></tr>`;
            if (!r.sub && r.description) html += `<tr class="desc-row"><td colspan="4" class="desc-cell-block">${escapeHtml(r.description)}</td></tr>`;
          }
        });
        return html + `</tbody></table></div>`;
      }).join("");
      return `<div class="result-category"><div class="result-section-title">${escapeHtml(section.title)}</div>${groupsHTML}</div>`;
    }).join("");
  }

  function renderAdminResult(row) {
    let report = row.report;
    if (row.answers) {
      const scores = calculateScores(row.answers);
      report = generateReport(scores, row.answers);
    }
    if (!report) {
      el("adminResultArea").innerHTML = `<div class="admin-empty">결과 데이터가 없습니다.</div>`;
      return;
    }
    const instructions = report.instructions || getGlobalInstructions();
    const contentId = "adminReportContent";
    el("adminResultArea").innerHTML = `
      <div class="patient-result-card">
        <div class="divider" style="margin-top:0;"></div>
        <div class="result-header-block">
          <h2 class="report-main-title">기분장애 임상평가 결과지</h2>
          <p class="report-date-line">${escapeHtml(fmtDate(row.completed_at))}&nbsp;&nbsp;번호: ${escapeHtml(row.assessment_key || row.patient_number || "-")}</p>
        </div>
        <details open style="margin-bottom:24px;">
          <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);padding:12px 16px;background:var(--accent-light);border-radius:10px;">
            📋 결과 해석 안내
          </summary>
          <div class="result-instructions" style="margin-top:8px;">${escapeHtml(instructions)}</div>
        </details>
        <div id="${contentId}"></div>
        <div class="print-btn-wrap">
          <button class="btn secondary sm btn-admin-pdf" data-patnum="${escapeAttr(row.assessment_key || row.patient_number || "result")}" data-date="${escapeAttr(fmtDate(row.completed_at))}">📄 PDF 다운로드</button>
          <button class="btn primary sm" onclick="window.print()">🖨️ 인쇄</button>
        </div>
      </div>`;
    const content = el(contentId);
    renderReportHTML(report, content);
    content.insertAdjacentHTML("beforeend", renderAnswerRawHTML(row.answers || {}));
  }

  async function searchAdminResult() {
    const hCode = el("adminSearchHCode").value.trim().toUpperCase();
    const requested = el("adminSearchPNum").value.trim();
    const parsed = requested.match(/^(\d{8})(?:-(\d+))?$/);
    if (!hCode || !parsed) {
      setMsg("adminResultMsg", "병원 코드와 의사에게 받은 번호를 모두 입력해주세요.", "warn");
      return;
    }
    const pNum = parsed[1];
    const requestedAssessment = parsed[2] ? Number(parsed[2]) : null;
    el("adminSearchHCode").value = hCode;
    setMsg("adminResultMsg", "검색 중...", "info");
    el("adminResultArea").innerHTML = "";
    let query = sb
      .from("survey_responses")
      .select("*")
      .eq("hospital_code", hCode)
      .eq("patient_number", pNum)
      .or("status.eq.completed,completed.eq.true")
      .order("completed_at", { ascending: false });
    if (requestedAssessment) query = query.eq("assessment_no", requestedAssessment);
    const { data, error } = await query.limit(1).maybeSingle();
    if (error) {
      setMsg("adminResultMsg", "오류: " + error.message, "error");
      return;
    }
    if (!data) {
      setMsg("adminResultMsg", `'${hCode} / ${requested}' 완료 결과가 없습니다.`, "warn");
      return;
    }
    clearMsg("adminResultMsg");
    renderAdminResult(data);
  }

  el("btnAdminSearchResult")?.addEventListener("click", searchAdminResult);
  el("adminSearchHCode")?.addEventListener("keydown", e => {
    if (e.key === "Enter") searchAdminResult();
  });
  el("adminSearchPNum")?.addEventListener("keydown", e => {
    if (e.key === "Enter") searchAdminResult();
  });

  document.addEventListener("click", async (e) => {
    const btn = e.target.closest(".btn-admin-pdf");
    if (!btn) return;
    const card = btn.closest(".patient-result-card");
    if (!card || !window.html2pdf) return;

    const patNum = btn.dataset.patnum || "result";
    const dateStr = (btn.dataset.date || new Date().toISOString().slice(0, 10)).replace(/\s+/g, "_");
    btn.disabled = true;
    btn.textContent = "⏳ 생성 중...";

    const pdfNode = card.cloneNode(true);
    pdfNode.classList.add("pdf-export");
    pdfNode.querySelectorAll(".raw-answer-view").forEach(n => n.remove());
    pdfNode.querySelectorAll("details").forEach(d => { d.open = true; });
    Object.assign(pdfNode.style, {
      position: "absolute",
      left: "0",
      top: "0",
      zIndex: "-1",
      background: "#ffffff"
    });
    document.body.appendChild(pdfNode);
    const oldScroll = window.scrollY;
    window.scrollTo(0, 0);

    try {
      await saveNodeAsFittedPdf(pdfNode, `Self_Report_Survey_Result_${dateStr}_${patNum}.pdf`);
      btn.textContent = "✅ PDF 완료";
      setTimeout(() => { btn.disabled = false; btn.textContent = "📄 PDF 다운로드"; }, 2000);
    } catch (err) {
      console.error("PDF 생성 오류:", err);
      btn.textContent = "❌ 오류";
      setTimeout(() => { btn.disabled = false; btn.textContent = "📄 PDF 다운로드"; }, 3000);
    } finally {
      pdfNode.remove();
      window.scrollTo(0, oldScroll);
    }
  });

  function escapeHtml(str) {
    if (str == null) return "";
    const div = document.createElement("div");
    div.textContent = String(str);
    return div.innerHTML;
  }
  function escapeAttr(str) {
    if (str == null) return "";
    return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function safeReportColor(value) {
    const color = String(value || "");
    return /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : "inherit";
  }

  function reportRankColor(rank, storedColor) {
    const value = Number(rank);
    if (!Number.isFinite(value)) return safeReportColor(storedColor);
    if (value < 50) return "#FF5C7A";
    if (value > 50) return "#2B3CFF";
    return "#5F6368";
  }

  function generateTemporaryPassword() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => chars[b % chars.length]).join("");
  }

  el("a_pw").addEventListener("keydown", (e) => {
    if (e.key === "Enter") el("btnLogin").click();
  });
  el("a_email").addEventListener("keydown", (e) => {
    if (e.key === "Enter") el("btnLogin").click();
  });

  checkSession();
</script>
</body>
</html>
